name: Build

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WCFNetworkTester.slnx

      - name: Build
        run: dotnet build WCFNetworkTester.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WCFNetworkTester.slnx --configuration Release --no-build
